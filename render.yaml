services:
  - type: web
    name: content-broadcasting-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: content-broadcasting-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: content-broadcasting-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: redis
    name: content-broadcasting-redis
    maxmemoryPolicy: allkeys-lru
    plan: free
    ipAllowList: []

databases:
  - name: content-broadcasting-db
    databaseName: content_broadcasting
    user: content_user